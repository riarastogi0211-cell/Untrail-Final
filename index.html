<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>untrail — Find your weekend</title>
  <meta name="description" content="untrail — your weekend, planned in 60 seconds." />

  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/screens.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>
  <div class="stage" id="stage">
    <div class="phone-fit" id="phone-fit">
      <div class="phone" id="phone" data-theme="light">
        <div class="phone__statusbar" id="statusbar" aria-hidden="true"></div>
        <main class="phone__viewport" id="app" aria-live="polite"></main>
        <div class="phone__home-indicator" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <div class="sr-only" id="sr-live" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
